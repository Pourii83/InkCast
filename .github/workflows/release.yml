name: Release

# Publishes InkCast-<tag>.zip as a GitHub release:
# - on a pushed v* tag
# - on a push to main whose InkCast.toc version has no release yet
# - on demand (Actions > Release > Run workflow)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^## Version: *//p' InkCast.toc | tr -d '\r')"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # Zip with an InkCast/ folder inside, so it extracts straight into Interface\AddOns
      - name: Build addon zip
        run: git archive --format=zip --prefix=InkCast/ -o "InkCast-${{ steps.tag.outputs.tag }}.zip" HEAD InkCast.toc Core.lua Modules Textures README.md

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="## ${{ steps.tag.outputs.tag }}" '
            $0 == tag { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          Extract the zip into `Interface\AddOns` so the folder is `Interface\AddOns\InkCast`, then restart the game.
          NOTES
          cat notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          zip="InkCast-${TAG}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              # release made in the GitHub UI: attach the zip
              gh release upload "$TAG" "$zip" --clobber
            else
              echo "Release $TAG already exists; bump the version in InkCast.toc to publish a new one."
            fi
          else
            gh release create "$TAG" "$zip" --title "InkCast ${TAG}" --notes-file notes.md --target "$GITHUB_SHA"
          fi
